plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

def gameTestServerWorldName = 'codex_gametest_clean'
def gameTestServerWorldDir = layout.projectDirectory.dir("run/${gameTestServerWorldName}")
def requiredOptionalModsProperty = 'apprenticecodex.requiredOptionalMods'

def optionalRuntimeModuleConfigurations = [
        create         : 'createRuntimeOnly',
        botania        : 'botaniaRuntimeOnly',
        puzzles_lib    : 'puzzlesLibRuntimeOnly',
        easy_magic     : 'easyMagicRuntimeOnly',
        cloth_config   : 'clothConfigRuntimeOnly',
        better_combat  : 'betterCombatRuntimeOnly',
        epic_fight     : 'epicFightRuntimeOnly',
        controlify     : 'controlifyRuntimeOnly',
        yacl           : 'yaclRuntimeOnly',
        lodestone      : 'lodestoneRuntimeOnly',
        malum          : 'malumRuntimeOnly',
]

def clientRuntimeModuleConfigurations = [
        moonlight_lib: 'moonlightLibClientRuntimeOnly',
        target_dummy : 'targetDummyClientRuntimeOnly',
]

def optionalRuntimeProfileModules = [
        compat              : ['create', 'botania', 'lodestone', 'malum'],
        easy_magic          : ['puzzles_lib', 'easy_magic'],
        better_combat       : ['cloth_config', 'better_combat'],
        epic_fight          : ['epic_fight'],
        epic_fight_controller: ['epic_fight', 'yacl', 'controlify'],
        compat_easy_better  : ['create', 'botania', 'lodestone', 'malum', 'puzzles_lib', 'easy_magic', 'cloth_config', 'better_combat'],
]

def optionalRuntimeSelectorModules = optionalRuntimeProfileModules + [
        puzzleslib    : ['puzzles_lib'],
        easymagic     : ['puzzles_lib', 'easy_magic'],
        bettercombat  : ['cloth_config', 'better_combat'],
        epicfight     : ['epic_fight'],
        epicfightcontroller: ['epic_fight', 'yacl', 'controlify'],
        controlify    : ['yacl', 'controlify'],
        create        : ['create'],
        botania       : ['botania'],
        lodestone     : ['lodestone'],
        malum         : ['lodestone', 'malum'],
]

def optionalRuntimeRequiredModIds = [
        compat        : 'create,botania,lodestone,malum',
        easy_magic    : 'puzzleslib,easymagic',
        better_combat : 'cloth_config,bettercombat',
        epic_fight    : 'epicfight',
]

def optionalRuntimeModuleModIds = [
        create         : 'create',
        botania        : 'botania',
        puzzles_lib    : 'puzzleslib',
        easy_magic     : 'easymagic',
        cloth_config   : 'cloth_config',
        better_combat  : 'bettercombat',
        epic_fight     : 'epicfight',
        controlify     : 'controlify',
        yacl           : 'yet_another_config_lib_v3',
        lodestone      : 'lodestone',
        malum          : 'malum',
]

def clientRuntimeModuleModIds = [
        moonlight_lib: 'moonlight',
        target_dummy : 'dummmmmmy',
]

def expandOptionalRuntimeModules = { Collection<String> selectors ->
    selectors.collectMany { selector ->
        def normalizedSelector = selector.trim().toLowerCase(Locale.ROOT).replace('-', '_')
        def modules = optionalRuntimeSelectorModules[normalizedSelector]
        if (modules == null) {
            throw new GradleException("Unknown optional runtime MOD/profile '${selector}'. Available: ${optionalRuntimeSelectorModules.keySet().sort().join(', ')}")
        }
        modules
    }.unique()
}

def modClassesTokenForModules = { Map<String, String> configurationNames, Map<String, String> modIds, Collection<String> modules ->
    { ->
        modules.collectMany { module ->
            def modId = modIds[module]
            configurations.named(configurationNames[module]).get().files.collect { file ->
                "${modId}%%${file.absolutePath}"
            }
        }.join(File.pathSeparator)
    }
}

def optionalRuntimeModClassesTokenForModules = { Collection<String> modules ->
    modClassesTokenForModules(optionalRuntimeModuleConfigurations, optionalRuntimeModuleModIds, modules)
}

def clientRuntimeModClassesTokenForModules = { Collection<String> modules ->
    { ->
        def clientRuntimeModClasses = modClassesTokenForModules(clientRuntimeModuleConfigurations, clientRuntimeModuleModIds, clientRuntimeModuleConfigurations.keySet())()
        def optionalRuntimeModClasses = optionalRuntimeModClassesTokenForModules(modules)()
        [clientRuntimeModClasses, optionalRuntimeModClasses].findAll { !it.isEmpty() }.join(File.pathSeparator)
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            lazyToken 'client_runtime_mod_classes', clientRuntimeModClassesTokenForModules([])
            environment 'MOD_CLASSES', "{source_roots}${File.pathSeparator}{client_runtime_mod_classes}"
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--world', gameTestServerWorldName
        }

        clientCompat {
            parent null, 'client'
            taskName 'runClientCompat'
            lazyToken 'client_runtime_mod_classes', clientRuntimeModClassesTokenForModules(expandOptionalRuntimeModules(['compat']))
            environment 'MOD_CLASSES', "{source_roots}${File.pathSeparator}{client_runtime_mod_classes}"
        }

        clientEasyMagic {
            parent null, 'client'
            taskName 'runClientEasyMagic'
            lazyToken 'client_runtime_mod_classes', clientRuntimeModClassesTokenForModules(expandOptionalRuntimeModules(['easy_magic']))
            environment 'MOD_CLASSES', "{source_roots}${File.pathSeparator}{client_runtime_mod_classes}"
        }

        clientBetterCombat {
            parent null, 'client'
            taskName 'runClientBetterCombat'
            lazyToken 'client_runtime_mod_classes', clientRuntimeModClassesTokenForModules(expandOptionalRuntimeModules(['better_combat']))
            environment 'MOD_CLASSES', "{source_roots}${File.pathSeparator}{client_runtime_mod_classes}"
        }

        clientEpicFight {
            parent null, 'client'
            taskName 'runClientEpicFight'
            lazyToken 'client_runtime_mod_classes', clientRuntimeModClassesTokenForModules(expandOptionalRuntimeModules(['epic_fight']))
            environment 'MOD_CLASSES', "{source_roots}${File.pathSeparator}{client_runtime_mod_classes}"
        }

        clientEpicFightController {
            parent null, 'client'
            taskName 'runClientEpicFightController'
            lazyToken 'client_runtime_mod_classes', clientRuntimeModClassesTokenForModules(expandOptionalRuntimeModules(['epic_fight_controller']))
            environment 'MOD_CLASSES', "{source_roots}${File.pathSeparator}{client_runtime_mod_classes}"
        }

        clientCompatEasyBetter {
            parent null, 'client'
            taskName 'runClientCompatEasyBetter'
            lazyToken 'client_runtime_mod_classes', clientRuntimeModClassesTokenForModules(expandOptionalRuntimeModules(['compat_easy_better']))
            environment 'MOD_CLASSES', "{source_roots}${File.pathSeparator}{client_runtime_mod_classes}"
        }

        gameTestServerCompat {
            parent null, 'gameTestServer'
            taskName 'runGameTestServerCompat'
            property requiredOptionalModsProperty, optionalRuntimeRequiredModIds.compat
            lazyToken 'optional_mod_classes', optionalRuntimeModClassesTokenForModules(expandOptionalRuntimeModules(['compat']))
            environment 'MOD_CLASSES', "{source_roots}${File.pathSeparator}{optional_mod_classes}"
        }

        gameTestServerEasyMagic {
            parent null, 'gameTestServer'
            taskName 'runGameTestServerEasyMagic'
            property requiredOptionalModsProperty, optionalRuntimeRequiredModIds.easy_magic
            lazyToken 'optional_mod_classes', optionalRuntimeModClassesTokenForModules(expandOptionalRuntimeModules(['easy_magic']))
            environment 'MOD_CLASSES', "{source_roots}${File.pathSeparator}{optional_mod_classes}"
        }

        gameTestServerBetterCombat {
            parent null, 'gameTestServer'
            taskName 'runGameTestServerBetterCombat'
            property requiredOptionalModsProperty, optionalRuntimeRequiredModIds.better_combat
            lazyToken 'optional_mod_classes', optionalRuntimeModClassesTokenForModules(expandOptionalRuntimeModules(['better_combat']))
            environment 'MOD_CLASSES', "{source_roots}${File.pathSeparator}{optional_mod_classes}"
        }

        gameTestServerEpicFight {
            parent null, 'gameTestServer'
            taskName 'runGameTestServerEpicFight'
            property requiredOptionalModsProperty, optionalRuntimeRequiredModIds.epic_fight
            lazyToken 'optional_mod_classes', optionalRuntimeModClassesTokenForModules(expandOptionalRuntimeModules(['epic_fight']))
            environment 'MOD_CLASSES', "{source_roots}${File.pathSeparator}{optional_mod_classes}"
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    optionalRuntimeModuleConfigurations.values().each { configurationName ->
        create(configurationName) {
            canBeConsumed = false
            canBeResolved = true
            transitive = true
        }
    }
    clientRuntimeModuleConfigurations.values().each { configurationName ->
        create(configurationName) {
            canBeConsumed = false
            canBeResolved = true
            transitive = true
        }
    }
}

tasks.register('cleanGameTestServerWorld', Delete) {
    group = 'verification'
    description = 'Deletes the dedicated GameTest world so runGameTestServer starts from clean world state.'
    delete gameTestServerWorldDir
}

tasks.matching { it.name.startsWith('runGameTestServer') }.configureEach {
    dependsOn tasks.named('cleanGameTestServerWorld')
}

def devRuntimeMods = providers.gradleProperty('devRuntimeMods').orNull
if (devRuntimeMods != null && !devRuntimeMods.trim().isEmpty()) {
    def devRuntimeModules = expandOptionalRuntimeModules(devRuntimeMods.split(',').collect { it.trim() }.findAll { !it.isEmpty() })
    minecraft.runs.named('client').configure {
        lazyToken 'client_runtime_mod_classes', clientRuntimeModClassesTokenForModules(devRuntimeModules)
        environment 'MOD_CLASSES', "{source_roots}${File.pathSeparator}{client_runtime_mod_classes}"
    }
}

// 依存のmavenをココに追加していく.
repositories {
    // 個別のmavenが無いものはModrinthから取得.
    // CurseForgeはCDN次第ではCIがコケるため極力使用しない.
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }

    // JEI / Patchouli
    maven {
        url = uri("https://maven.blamejared.com")
    }

    // ISS
    maven {
        url = uri("https://code.redspace.io/releases")
    }

    // GeckoLib
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }

    // Curios
    maven {
        url = uri("https://maven.theillusivec4.top/")
    }

    // Create が同梱している Registrate API を compileOnly 参照するため.
    maven {
        url = uri("https://maven.tterrag.com/")
    }
}

// 依存解決は基本ココ.
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // mixin.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // GeckoLib.
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation("com.eliotlash.mclib:mclib:20")

    // Curios.
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}+${minecraft_version}")

    // ISSへの強依存を追加.
    implementation fg.deobf("io.redspace:irons_spellbooks:${irons_spells_version}")

    // ISS前提MOD(2026/1/21時点それぞれ最新,動作確認用のみなのでruntimeOnly)
    runtimeOnly fg.deobf("maven.modrinth:curios:IPQlZkz1")
    runtimeOnly fg.deobf("maven.modrinth:geckolib:HVdLnQMI")
    runtimeOnly fg.deobf("maven.modrinth:playeranimator:xe2EVE6q")

    // Create.
    // Create 連携のコンパイル用.
    // ランタイム検証では compat profile から読み込む.
    compileOnly fg.deobf("maven.modrinth:create:8amzvn9x")
    compileOnly fg.deobf("com.tterrag.registrate:Registrate:MC1.20-1.3.3")
    add(optionalRuntimeModuleConfigurations.create, fg.deobf("maven.modrinth:create:8amzvn9x"))

    // Botania.
    // Solegnolia 判定だけを optional compat から参照する。
    compileOnly fg.deobf("vazkii.botania:Botania:${botania_version}:api")
    add(optionalRuntimeModuleConfigurations.botania, fg.deobf("vazkii.botania:Botania:${botania_version}"))

    // EasyMagic.
    // easy_magic profile から読み込む。通常開発ではエンチャント挙動の変化を避ける.
    add(optionalRuntimeModuleConfigurations.puzzles_lib, fg.deobf("maven.modrinth:puzzles-lib:V4g0yKzo"))
    add(optionalRuntimeModuleConfigurations.easy_magic, fg.deobf("maven.modrinth:easy-magic:W2xPEG9I"))

    // Farmer's Delight.
    // HarvestMoon の互換回帰を既存の標準 GameTest で検証するため、Jade と同様に開発環境では常時読み込む.
    runtimeOnly fg.deobf("maven.modrinth:farmers-delight:bCtijHxU")

    // Better Combat.
    // Better Combat の攻撃開始フックへ接続する互換コードのコンパイル用.
    // better_combat profile では前提である Cloth Config も合わせて読み込む.
    compileOnly fg.deobf("maven.modrinth:better-combat:rnhiaw3t")
    add(optionalRuntimeModuleConfigurations.cloth_config, fg.deobf("maven.modrinth:cloth-config:t8TXrZvZ"))
    add(optionalRuntimeModuleConfigurations.better_combat, fg.deobf("maven.modrinth:better-combat:rnhiaw3t"))

    // Epic Fight.
    // コンパイルは最低対応版に固定し、新しいAPIの誤使用を検出する.
    // ランタイムは epic_fight profile で20.14系最新を使い、最新側の挙動を見る.
    compileOnly "maven.modrinth:epic-fight:${epicfight_compile_modrinth_version_id}"
    add(optionalRuntimeModuleConfigurations.epic_fight, fg.deobf("maven.modrinth:epic-fight:${epicfight_runtime_modrinth_version_id}"))
    // Epic Fight対応済みのControlify Forgifiedを、専用client profileだけで検証する。
    add(optionalRuntimeModuleConfigurations.yacl, fg.deobf("maven.modrinth:yacl:${yacl_version}"))
    add(optionalRuntimeModuleConfigurations.controlify, fg.deobf("maven.modrinth:${controlify_modrinth_project_id}:${controlify_modrinth_version_id}"))

    // Lootr.
    // TreasureDivination が Lootr の個人開封済み判定へ接続するためのコンパイル用.
    compileOnly fg.deobf("noobanidus.mods.lootr:lootr-${minecraft_version}:${lootr_version}")

    // Lodestone / Malum.
    // compat profile から読み込む。通常開発では追加要素による調査ノイズを避ける.
    compileOnly fg.deobf("maven.modrinth:lodestonelib:dRIycWqx")
    compileOnly fg.deobf("maven.modrinth:malum:U88VbrNU")
    add(optionalRuntimeModuleConfigurations.lodestone, fg.deobf("maven.modrinth:lodestonelib:dRIycWqx"))
    add(optionalRuntimeModuleConfigurations.malum, fg.deobf("maven.modrinth:malum:U88VbrNU"))

    // JEI.
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // Jade.
    // 1.20.1 Forge の最新版を固定し、開発環境では JEI 同様に常時読み込む.
    compileOnly fg.deobf("maven.modrinth:jade:LecuGude")
    runtimeOnly fg.deobf("maven.modrinth:jade:LecuGude")

    // MmmMmmMmmMmm (Target Dummy).
    // 手動の火力・挙動確認用なのでコードから参照せず、runClient 系にだけ読み込む.
    // 2.0.11 以降は dev 環境用 refmap が欠け、ForgeGradle の runClient で mixin 解決に失敗するため 2.0.9 に固定する.
    add(clientRuntimeModuleConfigurations.moonlight_lib, fg.deobf("maven.modrinth:moonlight:43kjMXMx"))
    add(clientRuntimeModuleConfigurations.target_dummy, fg.deobf("maven.modrinth:Adega8YN:zAahRq2q"))

    // Patchouli.
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}:api")
    runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, create_version: create_version,
            botania_version: botania_version, jade_version: jade_version,
            lodestone_version: lodestone_version, malum_version: malum_version,
            epicfight_version: epicfight_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            mod_display_url: mod_display_url, mod_issue_tracker_url: mod_issue_tracker_url, mod_logo_file: mod_logo_file,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

def textEncodingHygieneIncludes = [
        '**/*.cfg',
        '**/*.gradle',
        '**/*.java',
        '**/*.json',
        '**/*.mcmeta',
        '**/*.md',
        '**/*.properties',
        '**/*.ps1',
        '**/*.toml',
        '**/*.txt',
        '**/*.yaml',
        '**/*.yml',
]

def textEncodingHygieneExcludes = [
        '.git/**',
        '.gradle/**',
        '.idea/**',
        'build/**',
        'bin/**',
        'mcmodsrepo/**',
        'out/**',
        'run/**',
        'run-data/**',
        // 中国語は文字化けか正しいのかチェックできなさそうなので意図的に除外.
        'src/main/resources/assets/apprenticecodex/lang/zh_cn.json',
]

tasks.register('checkTextEncodingHygiene') {
    group = 'verification'
    description = 'Fails on UTF-8 BOMs or obvious mojibake in repository text files.'

    inputs.files(fileTree(projectDir) {
        include textEncodingHygieneIncludes
        exclude textEncodingHygieneExcludes
    })

    doLast {
        def failures = []
        def suspiciousFragments = [
                '\u7E3A',
                '\u7E67',
                '\u7E5D',
                '\u8B41',
                '\u8B4C',
                '\u873F',
                '\u8B5B',
        ]
        def halfwidthKatakana = ~/.*[\uFF66-\uFF9F].*/

        fileTree(projectDir) {
            include textEncodingHygieneIncludes
            exclude textEncodingHygieneExcludes
        }.files.findAll { it.isFile() }.sort { it.path }.each { file ->
            byte[] bytes = file.bytes
            String relativePath = projectDir.toPath().relativize(file.toPath()).toString().replace(File.separator, '/')

            if (bytes.length >= 3
                    && (bytes[0] & 0xFF) == 0xEF
                    && (bytes[1] & 0xFF) == 0xBB
                    && (bytes[2] & 0xFF) == 0xBF) {
                failures << "${relativePath}:1 UTF-8 BOM is not allowed"
            }

            def decoder = java.nio.charset.StandardCharsets.UTF_8.newDecoder()
                    .onMalformedInput(java.nio.charset.CodingErrorAction.REPORT)
                    .onUnmappableCharacter(java.nio.charset.CodingErrorAction.REPORT)
            String text
            try {
                text = decoder.decode(java.nio.ByteBuffer.wrap(bytes)).toString()
            } catch (java.nio.charset.CharacterCodingException ignored) {
                failures << "${relativePath}:1 invalid UTF-8 byte sequence"
                return
            }

            text.readLines().eachWithIndex { line, index ->
                boolean hasReplacementCharacter = line.indexOf('\uFFFD') >= 0
                int fragmentHitCount = suspiciousFragments.count { fragment -> line.contains(fragment) }
                boolean hasLikelyMojibake = fragmentHitCount >= 2 || (fragmentHitCount >= 1 && line ==~ halfwidthKatakana)

                if (hasReplacementCharacter || hasLikelyMojibake) {
                    String excerpt = line.trim()
                    if (excerpt.length() > 120) {
                        excerpt = excerpt.substring(0, 120) + '...'
                    }
                    failures << "${relativePath}:${index + 1} possible mojibake: ${excerpt}"
                }
            }
        }

        if (!failures.isEmpty()) {
            def shownFailures = failures.take(50).join(System.lineSeparator())
            def omittedCount = failures.size() - Math.min(failures.size(), 50)
            def omittedMessage = omittedCount > 0 ? "${System.lineSeparator()}... and ${omittedCount} more" : ''
            throw new GradleException("Text encoding hygiene check failed:${System.lineSeparator()}${shownFailures}${omittedMessage}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('checkTextEncodingHygiene')
}

// メタ情報系.
tasks.named('jar', Jar).configure {
    // GameTest 用のクラス/structure は dev 実行だけで使い、配布 jar には含めない。
    exclude('jp/aquafactory/apprenticecodex/gametest/**')
    exclude('data/apprenticecodex/structures/gametest/**')

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    archiveBaseName.set(project.name)
    archiveVersion.set("${project.mod_version}+mc${project.minecraft_version}")
    finalizedBy 'reobfJar'
}

// mixin.
mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('checkProjectRemovalWarnings', JavaCompile) {
    group = 'verification'
    description = 'Fails on @Deprecated(forRemoval = true) API usage in project Java sources only.'

    source = sourceSets.main.java
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('tmp/checkProjectRemovalWarnings/classes')
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-proc:none', '-Xlint:none', '-Xlint:removal', '-Werror'])
}

def removalWarningSuppressionFiles = fileTree(layout.projectDirectory.dir('src/main/java')) {
    include '**/*.java'
}
def removalWarningSuppressionRootPath = layout.projectDirectory.asFile.toPath()

tasks.register('checkRemovalWarningSuppressions') {
    group = 'verification'
    description = 'Fails when @SuppressWarnings("removal") hides forRemoval deprecation warnings.'

    inputs.files(removalWarningSuppressionFiles)

    doLast {
        def failures = []
        def suppressWarningsPattern = ~/(?s)@(?:[A-Za-z_$][\w$]*\.)*SuppressWarnings\s*\((.*?)\)/
        def removalLiteralPattern = ~/["']removal["']/

        removalWarningSuppressionFiles.files.findAll { it.isFile() }.sort { it.path }.each { file ->
            def text = file.getText('UTF-8')
            def matcher = suppressWarningsPattern.matcher(text)

            while (matcher.find()) {
                if (removalLiteralPattern.matcher(matcher.group(1)).find()) {
                    def relativePath = removalWarningSuppressionRootPath.relativize(file.toPath()).toString().replace(File.separator, '/')
                    def lineNumber = text.substring(0, matcher.start()).count('\n') + 1
                    failures << "${relativePath}:${lineNumber} @SuppressWarnings(\"removal\") is not allowed"
                }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "@Deprecated(forRemoval = true) warnings must be fixed instead of suppressed:\n" +
                            failures.join('\n')
            )
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('checkProjectRemovalWarnings')
    dependsOn tasks.named('checkRemovalWarningSuppressions')
}
