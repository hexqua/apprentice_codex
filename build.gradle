plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 依存のmavenをココに追加していく.
repositories {
    // 前提MODをCFから引っ張るため.
    maven {
        url = uri("https://www.cursemaven.com")
    }

    // Optional MOD 検証用(EasyMagic / Puzzles Lib).
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }

    // JEI
    maven {
        url = uri("https://maven.blamejared.com")
    }

    // ISS
    maven {
        url = uri("https://code.redspace.io/releases")
    }

    // GeckoLib
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }

    // Curios
    maven {
        url = uri("https://maven.theillusivec4.top/")
    }
}

// 依存解決は基本ココ.
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // mixin.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // GeckoLib.
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation("com.eliotlash.mclib:mclib:20")

    // Curios.
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}+${minecraft_version}")

    // ISSへの強依存を追加.
    implementation fg.deobf("io.redspace:irons_spellbooks:${irons_spells_version}")

    // ISS前提MOD(2026/1/21時点それぞれ最新,動作確認用のみなのでruntimeOnly)
    runtimeOnly fg.deobf("curse.maven:curios-309927:6418456")
    runtimeOnly fg.deobf("curse.maven:geckolib-388172:7025129")
    runtimeOnly fg.deobf("curse.maven:playeranimator-658587:4587214")

    // Create.
    // 必要に応じてON、デフォルトは入れない(前提にはしないため)
    // runtimeOnly fg.deobf("curse.maven:create-328085:7178761")

    // EasyMagic.
    // 必要に応じてON、デフォルトは入れない(前提にはしないため)
    // runtimeOnly fg.deobf("maven.modrinth:puzzles-lib:V4g0yKzo")
    // runtimeOnly fg.deobf("maven.modrinth:easy-magic:W2xPEG9I")

    // Better Combat.
    // Better Combat の攻撃開始フックへ接続する互換コードのコンパイル用.
    // ランタイム検証時は Better Combat の前提である Cloth Config も合わせて入れる.
    compileOnly fg.deobf("maven.modrinth:better-combat:rnhiaw3t")
    // runtimeOnly fg.deobf("maven.modrinth:cloth-config:t8TXrZvZ")
    // runtimeOnly fg.deobf("maven.modrinth:better-combat:rnhiaw3t")

    // Lootr.
    // TreasureDivination が Lootr の個人開封済み判定へ接続するためのコンパイル用.
    compileOnly fg.deobf("noobanidus.mods.lootr:lootr-${minecraft_version}:${lootr_version}")

    // Lodestone / Malum.
    // 必要に応じてON、デフォルトは入れない(必須前提にはしないため)
    compileOnly fg.deobf("curse.maven:lodestone-616457:6213794")
    compileOnly fg.deobf("curse.maven:malum-484064:6646111")
    runtimeOnly fg.deobf("curse.maven:lodestone-616457:6213794")
    runtimeOnly fg.deobf("curse.maven:malum-484064:6646111")

    // JEI.
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // Patchouli.
    runtimeOnly fg.deobf("curse.maven:patchouli-306770:6164575")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            lodestone_version: lodestone_version, malum_version: malum_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            mod_display_url: mod_display_url, mod_issue_tracker_url: mod_issue_tracker_url, mod_logo_file: mod_logo_file,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// メタ情報系.
tasks.named('jar', Jar).configure {
    // GameTest 用のクラス/structure は dev 実行だけで使い、配布 jar には含めない。
    exclude('jp/aquafactory/apprenticecodex/gametest/**')
    exclude('data/apprenticecodex/structures/gametest/**')

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    archiveBaseName.set(project.name)
    archiveVersion.set("${project.mod_version}+mc${project.minecraft_version}")
    finalizedBy 'reobfJar'
}

// mixin.
mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
